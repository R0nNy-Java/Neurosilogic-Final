<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Evaluación IMC')}"></head>

<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="container my-4">
        <div class="row">
            <div class="col-md-5">
                <div class="card shadow-sm p-4">
                    <h4 class="fw-bold mb-3 text-success"><i class="fa-solid fa-weight-scale me-2"></i>Evaluación de IMC</h4>
                    <p class="text-muted small">Paciente: <strong th:text="${paciente.nombres + ' ' + paciente.apellidos}">Paciente</strong></p>

                    <form th:action="@{/evaluacion-imc/guardar}" method="post">
                        <input type="hidden" name="idPaciente" th:value="${paciente.idPaciente}">

                        <div class="mb-3">
                            <label class="form-label">Peso (Kg)</label>
                            <input type="number" step="0.1" name="pesoKg" class="form-control" placeholder="Ej. 70.5" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Estatura (Metros)</label>
                            <input type="number" step="0.01" name="estaturaM" class="form-control" placeholder="Ej. 1.75" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100"><i class="fa-solid fa-calculator me-1"></i> Calcular y Guardar IMC</button>
                    </form>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card shadow-sm p-4">
                    <h4 class="fw-bold mb-3"><i class="fa-solid fa-list me-2"></i>Historial de IMC</h4>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>Fecha</th>
                                    <th>Peso (Kg)</th>
                                    <th>Estatura (m)</th>
                                    <th>Valor IMC</th>
                                    <th>Diagnóstico</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="i : ${historial}">
                                    <td th:text="${#temporals.format(i.fechaRegistro, 'yyyy-MM-dd HH:mm')}">Fecha</td>
                                    <td th:text="${i.pesoKg + ' kg'}">70</td>
                                    <td th:text="${i.estaturaM + ' m'}">1.75</td>
                                    <td th:text="${#numbers.formatDecimal(i.valorIMC, 1, 2)}" class="fw-bold">22.86</td>
                                    <td th:text="${i.diagnostico}">Normal</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
