<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Gestión de Usuarios')}"></head>

<body class="bg-light" style="font-family:'Inter',sans-serif;">

  <div class="container-fluid p-0">
    <div class="row g-0" style="min-height:100vh;">

      <!-- Fragmento Sidebar -->
      <th:block th:replace="~{fragments/header :: header('usuarios')}"></th:block>

      <!-- CONTENIDO PRINCIPAL -->
      <div class="col">
        <!-- Topbar móvil -->
        <nav class="navbar navbar-dark bg-brand-gradient d-lg-none shadow-sm px-3">
          <div class="container-fluid px-0">
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMobile">
              <span class="navbar-toggler-icon"></span>
            </button>
            <span class="navbar-brand fw-bold mb-0">NURSELOGIC</span>
          </div>
        </nav>

        <!-- Topbar desktop -->
        <header id="nl-topbar" class="navbar navbar-dark bg-brand-gradient d-none d-lg-flex shadow-sm px-4" style="min-height:62px;">
          <span class="navbar-brand fw-semibold mb-0 d-flex align-items-center gap-2">
            <i class="bi bi-people-fill"></i>
            Gestión de Usuarios
          </span>
        </header>

        <main class="p-4">
          <div class="card border-0 shadow-sm p-4 rounded-4">
            <h3 class="fw-bold mb-3 text-primary"><i class="fa-solid fa-users-gear me-2"></i>Gestión de Usuarios del Sistema</h3>

            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="bg-success text-white">
                  <tr>
                    <th># ID</th>
                    <th>Usuario</th>
                    <th>Nombre Completo</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th class="text-center">Acciones</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="u : ${usuarios}">
                    <td th:text="${u.idUsuario}">1</td>
                    <td th:text="${u.nombreUsuario}" class="fw-bold">admin</td>
                    <td th:text="${u.nombreCompleto}">Nombre</td>
                    <td th:text="${u.email}">email@domain.com</td>
                    <td>
                      <th:block th:if="${u.nombreUsuario == 'admin' or u.idUsuario == 1}">
                        <span class="badge bg-primary px-3 py-2 fw-bold" style="font-size:0.8rem;"><i class="bi bi-shield-check me-1"></i>ADMINISTRADOR</span>
                      </th:block>
                      <th:block th:if="${u.nombreUsuario != 'admin' and u.idUsuario != 1}">
                        <form th:action="@{/gestionar-usuarios/asignar-rol}" method="post" class="d-flex align-items-center gap-1">
                          <input type="hidden" name="csrfToken" th:value="${csrfToken}"/>
                          <input type="hidden" name="idUsuario" th:value="${u.idUsuario}">
                          <select name="nuevoRol" class="form-select form-select-sm border-secondary fw-semibold" onchange="this.form.submit()" style="max-width: 150px; font-size: 0.8rem;">
                            <option value="SIN_ASIGNAR" th:selected="${u.rol == 'SIN_ASIGNAR' or u.rol == null}">⚠️ Sin Asignar</option>
                            <option value="ENFERMERO" th:selected="${u.rol == 'ENFERMERO'}">ENFERMERO</option>
                            <option value="ADMINISTRADOR" th:selected="${u.rol == 'ADMINISTRADOR' or u.rol == 'ADMIN'}">ADMINISTRADOR</option>
                          </select>
                        </form>
                      </th:block>
                    </td>
                    <td>
                      <span th:if="${!u.isBloqueado() and u.rol != 'SIN_ASIGNAR' and u.rol != null}" class="badge bg-success">ACTIVO</span>
                      <span th:if="${u.isBloqueado() and (u.rol == 'SIN_ASIGNAR' or u.rol == null)}" class="badge bg-warning text-dark">PENDIENTE DE APROBACIÓN</span>
                      <span th:if="${u.isBloqueado() and u.rol != 'SIN_ASIGNAR' and u.rol != null}" class="badge bg-danger">BLOQUEADO</span>
                    </td>
                    <td class="text-center">
                      <th:block th:if="${u.nombreUsuario == 'admin' or u.idUsuario == 1}">
                        <span class="badge bg-secondary py-2 px-3 text-white" style="font-size:0.75rem;"><i class="bi bi-lock-fill me-1"></i>Protegido</span>
                      </th:block>
                      <th:block th:if="${u.nombreUsuario != 'admin' and u.idUsuario != 1}">
                        <form th:action="@{/gestionar-usuarios/bloquear}" method="post" style="display:inline;">
                          <input type="hidden" name="csrfToken" th:value="${csrfToken}"/>
                          <input type="hidden" name="idUsuario" th:value="${u.idUsuario}">
                          <input type="hidden" name="nuevoEstado" th:value="${u.isBloqueado() ? 'A' : 'B'}">
                          <button type="submit" class="btn btn-sm" th:classappend="${u.isBloqueado() ? 'btn-success' : 'btn-danger'}">
                            <i class="fa-solid" th:classappend="${u.isBloqueado() ? 'fa-unlock' : 'fa-lock'}"></i>
                            <span th:text="${u.isBloqueado() ? ' Activar / Desbloquear' : ' Bloquear'}">Acción</span>
                          </button>
                        </form>
                      </th:block>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>

    </div>
  </div>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
