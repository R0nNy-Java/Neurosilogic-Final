<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Gestión de Pacientes')}"></head>

<body class="bg-light" style="font-family:'Inter',sans-serif;">

  <div class="container-fluid p-0">
    <div class="row g-0" style="min-height:100vh;">

      <!-- Fragmento Sidebar -->
      <th:block th:replace="~{fragments/header :: header('pacientes')}"></th:block>

      <!-- CONTENIDO PRINCIPAL -->
      <div class="col">
        <!-- Topbar móvil -->
        <nav class="navbar navbar-dark bg-brand-gradient d-lg-none shadow-sm px-3">
          <div class="container-fluid px-0">
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMobile">
              <span class="navbar-toggler-icon"></span>
            </button>
            <span class="navbar-brand fw-bold mb-0">NURSELOGIC</span>
          </div>
        </nav>

        <!-- Topbar desktop -->
        <header id="nl-topbar" class="navbar navbar-dark bg-brand-gradient d-none d-lg-flex shadow-sm px-4" style="min-height:62px;">
          <span class="navbar-brand fw-semibold mb-0 d-flex align-items-center gap-2">
            <i class="bi bi-person-badge"></i>
            Gestión de Pacientes
          </span>
          <div class="d-flex align-items-center gap-3 ms-auto">
            <a th:href="@{/pacientes/nuevo}" class="btn btn-light btn-sm fw-bold d-flex align-items-center gap-1">
              <i class="bi bi-person-plus-fill"></i>Nuevo Paciente
            </a>
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1">
              <i class="bi bi-box-arrow-right"></i>Salir
            </a>
          </div>
        </header>

        <main class="p-4">
          <div class="card border-0 shadow-sm p-4 rounded-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold mb-0 text-success"><i class="bi bi-hospital me-2"></i>Listado de Pacientes Registrados</h4>
                <a th:href="@{/pacientes/nuevo}" class="btn btn-success btn-sm">
                    <i class="bi bi-person-plus-fill me-1"></i> Registrar Nuevo Paciente
                </a>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="bg-success text-white">
                        <tr>
                            <th># ID</th>
                            <th>Cédula</th>
                            <th>Nombres Completos</th>
                            <th>Edad</th>
                            <th>Sexo</th>
                            <th class="text-center">Ficha Clínica</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${pacientes}">
                            <td th:text="${p.idPaciente}">1</td>
                            <td th:text="${p.cedula}" class="fw-bold font-monospace">1723456789</td>
                            <td th:text="${p.nombres + ' ' + p.apellidos}">Nombre</td>
                            <td th:text="${p.edad + ' años'}">0</td>
                            <td><span class="badge bg-secondary" th:text="${p.sexo}">M</span></td>
                            <td class="text-center">
                                <a th:href="@{/paciente/panel(id=${p.idPaciente})}" class="btn btn-outline-success btn-sm">
                                    <i class="bi bi-file-earmark-medical me-1"></i> Ver Ficha
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${pacientes.isEmpty()}">
                            <td colspan="6" class="text-center text-muted py-4">No hay pacientes registrados aún.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
          </div>
        </main>
      </div>

    </div>
  </div>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
