<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Registro de Paciente')}"></head>

<body class="bg-light" style="font-family:'Inter',sans-serif;">

  <div class="container-fluid p-0">
    <div class="row g-0" style="min-height:100vh;">

      <!-- Fragmento Sidebar -->
      <th:block th:replace="~{fragments/header :: header('pacientes')}"></th:block>

      <!-- CONTENIDO PRINCIPAL -->
      <div class="col">
        <!-- Topbar móvil -->
        <nav class="navbar navbar-dark bg-brand-gradient d-lg-none shadow-sm px-3">
          <div class="container-fluid px-0">
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMobile">
              <span class="navbar-toggler-icon"></span>
            </button>
            <span class="navbar-brand fw-bold mb-0">NURSELOGIC</span>
          </div>
        </nav>

        <!-- Topbar desktop -->
        <header id="nl-topbar" class="navbar navbar-dark bg-brand-gradient d-none d-lg-flex shadow-sm px-4" style="min-height:62px;">
          <span class="navbar-brand fw-semibold mb-0 d-flex align-items-center gap-2">
            <i class="bi bi-person-plus-fill"></i>
            Registrar Nuevo Paciente
          </span>
          <div class="d-flex align-items-center gap-3 ms-auto">
            <a th:href="@{/pacientes}" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1">
              <i class="bi bi-arrow-left"></i>Volver a Pacientes
            </a>
          </div>
        </header>

        <main class="p-4">
          <div class="card border-0 shadow-sm p-4 rounded-4" style="max-width: 600px;">
            <h3 class="fw-bold mb-3 text-primary"><i class="fa-solid fa-user-plus me-2"></i>Registrar Nuevo Paciente</h3>

            <div th:if="${error}" class="alert alert-danger p-2" th:text="${error}"></div>

            <form th:action="@{/pacientes/guardar}" method="post" th:object="${paciente}">
              <div class="mb-3">
                <label class="form-label font-weight-bold">Cédula de Identidad</label>
                <input type="text" th:field="*{cedula}" class="form-control" placeholder="Ej. 1723456789" required maxlength="10">
              </div>

              <div class="mb-3">
                <label class="form-label">Nombres</label>
                <input type="text" th:field="*{nombres}" class="form-control" placeholder="Ej. Juan Carlos" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Apellidos</label>
                <input type="text" th:field="*{apellidos}" class="form-control" placeholder="Ej. Pérez Gómez" required>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">Edad</label>
                  <input type="number" th:field="*{edad}" class="form-control" min="0" max="120" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Sexo</label>
                  <select th:field="*{sexo}" class="form-select" required>
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                  </select>
                </div>
              </div>

              <div class="d-flex justify-content-between mt-3">
                <a th:href="@{/pacientes}" class="btn btn-secondary"><i class="fa-solid fa-arrow-left me-1"></i> Cancelar</a>
                <button type="submit" class="btn btn-success"><i class="fa-solid fa-floppy-disk me-1"></i> Guardar Paciente</button>
              </div>
            </form>
          </div>
        </main>
      </div>

    </div>
  </div>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
