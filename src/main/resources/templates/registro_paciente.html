<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Registro de Paciente')}"></head>

<body class="bg-light" style="font-family:'Inter',sans-serif;">

  <div class="container-fluid p-0">
    <div class="row g-0" style="min-height:100vh;">

      <!-- Fragmento Sidebar -->
      <th:block th:replace="~{fragments/header :: header('pacientes')}"></th:block>

      <!-- CONTENIDO PRINCIPAL -->
      <div class="col">
        <!-- Topbar móvil -->
        <nav class="navbar navbar-dark bg-brand-gradient d-lg-none shadow-sm px-3">
          <div class="container-fluid px-0">
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMobile">
              <span class="navbar-toggler-icon"></span>
            </button>
            <span class="navbar-brand fw-bold mb-0">NURSELOGIC</span>
          </div>
        </nav>

        <!-- Topbar desktop -->
        <header id="nl-topbar" class="navbar navbar-dark bg-brand-gradient d-none d-lg-flex shadow-sm px-4" style="min-height:62px;">
          <span class="navbar-brand fw-semibold mb-0 d-flex align-items-center gap-2">
            <i class="bi bi-person-plus-fill"></i>
            Registrar Nuevo Paciente
          </span>
          <div class="d-flex align-items-center gap-3 ms-auto">
            <a th:href="@{/pacientes}" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1">
              <i class="bi bi-arrow-left"></i>Volver a Pacientes
            </a>
          </div>
        </header>

        <main class="p-4 d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 90px);">
          <div class="card border-0 shadow-sm p-4 rounded-4 w-100" style="max-width: 650px;">
            <div class="text-center mb-4">
              <div class="rounded-circle bg-primary bg-opacity-10 d-inline-flex align-items-center justify-content-center p-3 mb-2" style="width:70px;height:70px;">
                <i class="bi bi-person-plus-fill text-primary fs-2"></i>
              </div>
              <h3 class="fw-bold mb-1 text-dark">Registrar Nuevo Paciente</h3>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/pacientes/guardar}" method="post" th:object="${paciente}">
              <input type="hidden" name="csrfToken" th:value="${csrfToken}"/>
              <div class="mb-3">
                <label class="form-label fw-semibold">Cédula de Identidad *</label>
                <input type="text" th:field="*{cedula}" class="form-control form-control-lg bg-light fs-6" placeholder="Ej. 1723456789" required maxlength="10" autofocus>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Nombres *</label>
                <input type="text" th:field="*{nombres}" class="form-control form-control-lg bg-light fs-6" placeholder="Ej. Juan Carlos" required>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Apellidos *</label>
                <input type="text" th:field="*{apellidos}" class="form-control form-control-lg bg-light fs-6" placeholder="Ej. Pérez Gómez" required>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-semibold">Fecha de Nacimiento *</label>
                  <input type="date" th:field="*{fechaNacimiento}" class="form-control form-control-lg bg-light fs-6"
                         th:max="${T(java.time.LocalDate).now().minusDays(1)}" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-semibold">Sexo *</label>
                  <select th:field="*{sexo}" class="form-select form-select-lg bg-light fs-6" required>
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                  </select>
                </div>
              </div>

              <div class="d-flex justify-content-between gap-3 mt-4">
                <a th:href="@{/pacientes}" class="btn btn-light btn-lg px-4 border text-muted"><i class="bi bi-x-circle me-1"></i> Cancelar</a>
                <button type="submit" class="btn btn-success btn-lg px-4 fw-bold flex-grow-1"><i class="bi bi-floppy-fill me-2"></i> Guardar y Continuar</button>
              </div>
            </form>
          </div>
        </main>
      </div>

    </div>
  </div>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
