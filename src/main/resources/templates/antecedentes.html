<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Antecedentes Médicos')}"></head>

<body class="bg-light" style="font-family:'Inter',sans-serif;">

  <div class="container-fluid p-0">
    <div class="row g-0" style="min-height:100vh;">

      <!-- Fragmento Sidebar -->
      <th:block th:replace="~{fragments/header :: header('pacientes')}"></th:block>

      <!-- CONTENIDO PRINCIPAL -->
      <div class="col">
        <!-- Topbar móvil -->
        <nav class="navbar navbar-dark bg-brand-gradient d-lg-none shadow-sm px-3">
          <div class="container-fluid px-0">
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMobile">
              <span class="navbar-toggler-icon"></span>
            </button>
            <span class="navbar-brand fw-bold mb-0">NURSELOGIC</span>
          </div>
        </nav>

        <!-- Topbar desktop -->
        <header id="nl-topbar" class="navbar navbar-dark bg-brand-gradient d-none d-lg-flex shadow-sm px-4" style="min-height:62px;">
          <span class="navbar-brand fw-semibold mb-0 d-flex align-items-center gap-2">
            <i class="bi bi-file-medical"></i>
            Antecedentes Médicos
          </span>
          <div class="d-flex align-items-center gap-3 ms-auto">
            <a th:href="@{/paciente/panel(id=${paciente.idPaciente})}" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1">
              <i class="bi bi-arrow-left"></i>Volver a la Ficha
            </a>
          </div>
        </header>

        <main class="p-4">
          <div class="row">
            <div class="col-md-5">
              <div class="card border-0 shadow-sm p-4 rounded-4">
                <h4 class="fw-bold mb-3 text-info"><i class="fa-solid fa-file-medical me-2"></i>Nuevo Antecedente</h4>
                <p class="text-muted small">Paciente: <strong th:text="${paciente.nombres + ' ' + paciente.apellidos}">Paciente</strong></p>

                <form th:action="@{/antecedentes/guardar}" method="post">
                  <input type="hidden" name="csrfToken" th:value="${csrfToken}"/>
                  <input type="hidden" name="idPaciente" th:value="${paciente.idPaciente}">

                  <div class="mb-3">
                    <label class="form-label">Tipo de Antecedente</label>
                    <select name="tipo" id="selectTipo" class="form-select" required onchange="toggleFormAntecedente()">
                      <option value="Patológico">Patológico (Enfermedades crónicas asociadas)</option>
                      <option value="Alergia">Alergia (Medicamento / Alimento / Sustancia)</option>
                      <option value="Quirúrgico">Quirúrgico (Procedimientos quirúrgicos)</option>
                      <option value="No Patológico">No Patológico (Hábitos, estilo de vida)</option>
                      <option value="Familiar">Heredofamiliar</option>
                    </select>
                  </div>

                  <!-- Campo de Selección de Enfermedad Inscrita -->
                  <div class="mb-3" id="groupEnfermedad">
                    <label class="form-label">Seleccionar Enfermedad Inscrita *</label>
                    <select name="enfermedadSeleccionada" class="form-select">
                      <option value="">-- Seleccionar Patología Inscrita --</option>
                      <option th:each="enf : ${enfermedades}" th:value="${enf.nombreEnfermedad}" th:text="${enf.nombreEnfermedad + ' (' + enf.categoria + ')'}"></option>
                    </select>
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Descripción Detallada / Observación</label>
                    <textarea name="descripcion" class="form-control" rows="3" placeholder="Detalles de diagnóstico, tratamiento o nivel de alergia" required></textarea>
                  </div>

                  <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-info text-white flex-grow-1"><i class="fa-solid fa-floppy-disk me-1"></i> Guardar Antecedente</button>
                    <a th:href="@{/evaluacion-imc(idPaciente=${paciente.idPaciente})}" class="btn btn-outline-info d-flex align-items-center gap-1" title="Ir al Paso 2: Evaluación IMC">
                      Paso Siguiente <i class="bi bi-arrow-right-short fs-5"></i>
                    </a>
                  </div>
                </form>
              </div>
            </div>

            <div class="col-md-7">
              <div class="card border-0 shadow-sm p-4 rounded-4">
                <h4 class="fw-bold mb-3"><i class="fa-solid fa-list me-2"></i>Historial de Antecedentes</h4>
                <div class="table-responsive">
                  <table class="table table-hover align-middle">
                    <thead class="bg-success text-white">
                      <tr>
                        <th>Fecha</th>
                        <th>Tipo</th>
                        <th>Descripción</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="a : ${historial}">
                        <td th:text="${#temporals.format(a.fechaRegistro, 'yyyy-MM-dd HH:mm')}">Fecha</td>
                        <td><span class="badge bg-info text-dark" th:text="${a.tipo}">Tipo</span></td>
                        <td th:text="${a.descripcion}">Descripción</td>
                      </tr>
                      <tr th:if="${historial.isEmpty()}">
                        <td colspan="3" class="text-center text-muted py-3">Sin antecedentes registrados.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>

    </div>
  </div>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
