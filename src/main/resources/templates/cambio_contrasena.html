<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Cambiar Contraseña')}"></head>

<body class="bg-light" style="font-family:'Inter',sans-serif;">

  <div class="container-fluid p-0">
    <div class="row g-0" style="min-height:100vh;">

      <!-- Fragmento Sidebar -->
      <th:block th:replace="~{fragments/header :: header('')}"></th:block>

      <!-- CONTENIDO PRINCIPAL -->
      <div class="col">
        <!-- Topbar móvil -->
        <nav class="navbar navbar-dark bg-brand-gradient d-lg-none shadow-sm px-3">
          <div class="container-fluid px-0">
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMobile">
              <span class="navbar-toggler-icon"></span>
            </button>
            <span class="navbar-brand fw-bold mb-0">NURSELOGIC</span>
          </div>
        </nav>

        <!-- Topbar desktop -->
        <header id="nl-topbar" class="navbar navbar-dark bg-brand-gradient d-none d-lg-flex shadow-sm px-4" style="min-height:62px;">
          <span class="navbar-brand fw-semibold mb-0 d-flex align-items-center gap-2">
            <i class="bi bi-key"></i>
            Cambiar Contraseña
          </span>
        </header>

        <main class="p-4">
          <div class="card border-0 shadow-sm p-4 rounded-4" style="max-width: 500px;">
            <h4 class="fw-bold mb-3 text-primary"><i class="fa-solid fa-lock me-2"></i>Cambiar Mi Contraseña</h4>

            <div th:if="${error}" class="alert alert-danger p-2" th:text="${error}"></div>
            <div th:if="${mensaje}" class="alert alert-success p-2" th:text="${mensaje}"></div>

            <form th:action="@{/cambio-contrasena}" method="post">
              <input type="hidden" name="csrfToken" th:value="${csrfToken}"/>
              <div class="mb-3">
                <label class="form-label">Contraseña Actual</label>
                <input type="password" name="contrasenaActual" class="form-control" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Nueva Contraseña</label>
                <input type="password" name="nuevaContrasena" id="nuevaContrasena" class="form-control" required minlength="8">
                <div class="small mt-1">
                    <span id="reqLongitud" class="req-fail"><i class="bi bi-circle-fill" style="font-size:.5rem;"></i> Al menos 8 caracteres</span> &nbsp;
                    <span id="reqMayuscula" class="req-fail"><i class="bi bi-circle-fill" style="font-size:.5rem;"></i> Una mayúscula</span> &nbsp;
                    <span id="reqEspecial" class="req-fail"><i class="bi bi-circle-fill" style="font-size:.5rem;"></i> Un carácter especial</span>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100"><i class="fa-solid fa-key me-1"></i> Actualizar Contraseña</button>
            </form>
          </div>
        </main>
      </div>

    </div>
  </div>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <script>
    document.getElementById('nuevaContrasena').addEventListener('input', function () {
      var valor = this.value;
      var marcar = function (id, cumple) {
        var el = document.getElementById(id);
        el.classList.toggle('req-ok', cumple);
        el.classList.toggle('req-fail', !cumple);
      };
      marcar('reqLongitud', valor.length >= 8);
      marcar('reqMayuscula', /[A-Z]/.test(valor));
      marcar('reqEspecial', /[^A-Za-z0-9]/.test(valor));
    });
  </script>
</body>
</html>
